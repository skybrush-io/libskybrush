name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The conformance test cases and the golden traces of the binary show
      # file format are maintained in a private repository of the organization,
      # next to the specification. It is checked out with a read-only deploy
      # key. Secrets are not available for pull requests from forks; the tests
      # that need the specification are skipped in that case.
      - name: Check whether the file format specification is accessible
        id: spec
        env:
          SPEC_REPO_DEPLOY_KEY: ${{ secrets.SPEC_REPO_DEPLOY_KEY }}
        run: |
          if [ -n "$SPEC_REPO_DEPLOY_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deploy key of the specification repository is not available; skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the file format specification
        if: steps.spec.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: skybrush-io/file-formats-doc
          path: file-formats-doc
          ssh-key: ${{ secrets.SPEC_REPO_DEPLOY_KEY }}

      - name: Install dependencies
        run: sudo apt-get install -y gcovr

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DBUILD_TESTING=ON
          -DLIBSKYBRUSH_ENABLE_CODE_COVERAGE=ON
          -DUSE_SANITIZER=Address\;Undefined
          -DLIBSKYBRUSH_REQUIRE_SPEC_TESTS=${{ steps.spec.outputs.available == 'true' && 'ON' || 'OFF' }}
          -DLIBSKYBRUSH_SKYB_CONFORMANCE_CASES=${{github.workspace}}/file-formats-doc/spec/skyb/conformance/cases.json
          -DLIBSKYBRUSH_SKYB_TRACES=${{github.workspace}}/file-formats-doc/spec/skyb/traces

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: ctest -C ${{env.BUILD_TYPE}}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # Short coverage-guided fuzzing session of the parsers and players, seeded
  # with the test fixtures. Crashing inputs are uploaded as an artifact.
  fuzz:
    # Pinned because the name of the libFuzzer runtime package contains the
    # major version of Clang
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y clang-18 libclang-rt-18-dev ninja-build

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DBUILD_TESTING=ON
          -DLIBSKYBRUSH_ENABLE_FUZZING=ON
          -DUSE_SANITIZER=Address\;Undefined

      - name: Build
        run: cmake --build ${{github.workspace}}/build --target fuzz_show fuzz_block

      - name: Fuzz
        working-directory: ${{github.workspace}}/build
        run: |
          mkdir -p corpus_show corpus_block crashes
          cp ${{github.workspace}}/test/fixtures/*.skyb corpus_show/
          python3 ${{github.workspace}}/test/fuzz/make_block_seeds.py corpus_block ${{github.workspace}}/test/fixtures/*.skyb
          for target in show block; do
            ./test/fuzz/fuzz_$target corpus_$target -artifact_prefix=crashes/${target}_ \
              -max_total_time=120 -timeout=30 -rss_limit_mb=2048 -max_len=65536
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: ${{github.workspace}}/build/crashes
